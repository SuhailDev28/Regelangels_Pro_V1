<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Rebel Angels</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #fff5f5;
        color: #0f172a;
      }
      .card {
        max-width: 420px;
        padding: 28px;
        border-radius: 22px;
        background: white;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        text-align: center;
      }
      h1 {
        margin: 0 0 10px;
        color: #e11d2e;
      }
      p {
        margin: 0;
        color: #64748b;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>Please check your internet connection and reopen Rebel Angels.</p>
    </div>
  </body>
</html>
